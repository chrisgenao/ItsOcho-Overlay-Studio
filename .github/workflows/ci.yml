name: CI - Verify source
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Python syntax and local HTTP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect source and compile Python
        run: python tools/ci_release.py verify
      - name: Check local endpoints
        run: python tools/ci_release.py smoke
